name: 🚀 Deploy Production

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    name: 🌱 Install, Test and Package
    runs-on: ubuntu-latest
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1

      - name: Set up JDK and Maven
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '22'
          distribution: 'corretto'
          cache: maven

      - name: 📂 Test and Package with Maven
        run: mvn clean package

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  build-and-push-ghcr:
    name: 🐳 Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      image_name: ${{ steps.meta.outputs.image_name }}

    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1

      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up JDK (for version extraction)
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 📝 Set Release Metadata
        id: meta
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_NAME="v${VERSION}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          
          echo "release_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: 🔧 Set up QEMU (Multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          #tags: |
          #  ${{ steps.meta.outputs.image_name }}:latest
          #  ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.release_version }}
          #  ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag_name }}
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag_name }}

  create-release:
    name: 🏷️ Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr
    permissions:
      contents: write
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 📝 Generate Release Changelog
        id: changelog
        env:
          TAG_NAME: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          VERSION: ${{ needs.build-and-push-ghcr.outputs.release_version }}
          IMAGE_NAME: ${{ needs.build-and-push-ghcr.outputs.image_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 20 --oneline --no-merges --pretty=format:"* %s (%h)")
          fi

          cat <<EOF > release_notes.md
          # Material Home Assistant ${TAG_NAME}

          Nuova versione di **Material Home Assistant** compilata e distribuita con successo su GitHub Container Registry.

          ### 📦 Dettagli Rilascio
          - **Versione:** \`${VERSION}\`
          - **Tag:** \`${TAG_NAME}\`
          - **Immagine Docker:** \`${IMAGE_NAME}:${VERSION}\`

          ### 🛠️ Modifiche incluse
          ${COMMITS}
          EOF

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          name: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}