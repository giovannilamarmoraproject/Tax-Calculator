name: 🚀 Deploy Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🌱 Install, Test and Package
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    environment:
      name: Production
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1

      - name: Set up JDK and Maven
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '22'
          distribution: 'corretto'
          cache: maven

      - name: 📂 Test and Package with Maven
        run: mvn clean package

      - name: 📝 Extract Release Metadata
        id: meta
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "release_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  build-image:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: Production
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1

      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target/

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🛠️ Build and Export OCI Archive
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=temp-image,push=false,name-canonical=true
        env:
          PLATFORM_PAIR: ${{ matrix.platform }}

      - name: 📦 Sanitize Platform Name
        id: sanitize
        run: |
          PLATFORM_SLUG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "slug=${PLATFORM_SLUG}" >> $GITHUB_OUTPUT

      - name: 📤 Upload Platform Image
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.sanitize.outputs.slug }}
          path: ${{ runner.temp }}/docker-buildx/
          if-no-files-found: ignore
          retention-days: 1

  deploy-ghcr:
    name: 🚀 Deploy to GHCR
    runs-on: ubuntu-latest
    needs: [ build-and-test, build-image ]
    environment:
      name: Production
    permissions:
      contents: read
      packages: write
    outputs:
      release_version: ${{ needs.build-and-test.outputs.release_version }}
      tag_name: ${{ needs.build-and-test.outputs.tag_name }}
      image_name: ${{ steps.image_meta.outputs.image_name }}
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1

      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target/

      - name: 📝 Set Image Metadata
        id: image_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Push Multi-Platform Image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          #tags: |
          #  ${{ steps.meta.outputs.image_name }}:latest
          #  ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.release_version }}
          #  ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag_name }}
          tags: |
            ${{ steps.image_meta.outputs.image_name }}:latest
            ${{ steps.image_meta.outputs.image_name }}:${{ needs.build-and-test.outputs.release_version }}
            ${{ steps.image_meta.outputs.image_name }}:${{ needs.build-and-test.outputs.tag_name }}

  create-release:
    name: 🏷️ Publish GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-ghcr
    environment:
      name: Production
    permissions:
      contents: write
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 📝 Generate Release Changelog
        id: changelog
        env:
          TAG_NAME: ${{ needs.deploy-ghcr.outputs.tag_name }}
          VERSION: ${{ needs.deploy-ghcr.outputs.release_version }}
          IMAGE_NAME: ${{ needs.deploy-ghcr.outputs.image_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 20 --oneline --no-merges --pretty=format:"* %s (%h)")
          fi

          cat <<EOF > release_notes.md
          # Tax Calculator ${TAG_NAME}

          New version of **Tax Calculator** successfully built and deployed to GitHub Container Registry.

          ### 📦 Release Details
          - **Version:** \`${VERSION}\`
          - **Tag:** \`${TAG_NAME}\`
          - **Docker Image:** \`${IMAGE_NAME}:${VERSION}\`

          ### 🛠️ Changes Included
          ${COMMITS}
          EOF

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.deploy-ghcr.outputs.tag_name }}
          name: ${{ needs.deploy-ghcr.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}